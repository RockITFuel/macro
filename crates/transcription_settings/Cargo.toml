[package]
edition = "2024"
name = "transcription_settings"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:entity_access",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/axum",
  "entity_access/inbound",
  "entity_access/ports",
  "ports",
]
outbound = ["dep:entity_access", "entity_access/ports", "ports"]
ports = ["dep:tracing"]
postgres = ["dep:sqlx", "outbound"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
entity_access = { path = "../entity_access", default-features = false, optional = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response", optional = true }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
macro_db_migrator = { path = "../macro_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v7"] }
